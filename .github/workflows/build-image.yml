# 构建并推送 Ivano Chat 镜像到 GHCR
#
# 触发：
#   - 推送到 dev 分支        → 生成 :dev 与 :sha-<short>
#   - 推送到 main 分支       → 生成 :main 与 :sha-<short>
#   - 推送 v* 标签           → 生成 :v1.2.3（以及 :latest）
#   - 手动 workflow_dispatch
#
# 产物：ghcr.io/<你的用户名>/ivano-chat:<tag>（默认只构建 linux/arm64，匹配你的服务器）
#
# 说明：
#   * 你的服务器是 aarch64，默认只构建 arm64；如需本地 x86 测试，把 PLATFORMS 改成 linux/amd64,linux/arm64
#   * 如果仓库是 public 且能用 GitHub 免费 arm64 runner，可把 runs-on 换成 ubuntu-24.04-arm
#     并删除 QEMU 步骤，构建会快很多（QEMU 模拟下 Go+CGO 编译大约 10-25 分钟）
#   * 镜像默认同源部署：NEXT_PUBLIC_API_BASE_URL 留空（前端与 API 由同一个容器提供）

name: build-image

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (跨架构构建 arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ivano-chat
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
